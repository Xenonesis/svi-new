packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  'core-js': true
  'esbuild': true
  'sharp': true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.23'
  - '@ai-sdk/groq@4.0.12'
  - '@ai-sdk/mcp@2.0.15'
  - '@ai-sdk/provider-utils@5.0.11'
  - '@ai-sdk/react@4.0.34'
  - ai@7.0.31
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - uuid@11.1.1
  - sharp@0.35.0
  - tar@7.5.21
  - brace-expansion@5.0.9
  - '@supabase/auth-js@2.112.1'
  - '@supabase/postgrest-js@2.112.1'
  - '@supabase/realtime-js@2.112.1'
  - nanoid@3.3.18

overrides:
  brace-expansion@<=5.0.8: ^5.0.9
  fast-uri@<=3.1.4: ^3.1.5
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  tar@<=7.5.20: ^7.5.21
  uuid@<11.1.1: ^11.1.1
  nanoid@<3.3.18: '>=3.3.18'

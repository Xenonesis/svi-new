name: CI & Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on moderate+)
        run: npm audit --audit-level=moderate

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint || true

      - name: TypeScript type check
        run: npx tsc --noEmit || true

  perf-checks:
    name: Performance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate image sizes (warn, don't block)
        # Warns if unoptimized images exceed budget — run optimize:images to fix
        run: node scripts/check-image-sizes.mjs || true

      - name: Detect unused dependencies
        # Warn only — requires manual cleanup review
        run: npx depcheck --ignores="@types/*,typescript-eslint,vitest,prettier*,eslint*,autoprefixer,postcss,tailwindcss,editorconfig-checker,commitlint,husky,lint-staged,cross-env,tsx,esbuild,jsdom,globals" || true

      - name: Check for duplicate packages
        run: npx duplicate-package-checker-webpack-plugin || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [security-audit, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (skip image optimization in CI for speed)
        # SKIP_IMAGE_OPTIMIZE lets the prebuild hook be bypassed in CI
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SKIP_IMAGE_OPTIMIZE: 'true'

      - name: Bundle size check (warn, don't block)
        # Reports if any chunk exceeds 100 KB budget
        run: node scripts/perf-monitor.mjs || true

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [security-audit, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium --reporter=list
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
